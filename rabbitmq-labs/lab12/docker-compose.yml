
services:
  rabbit1:
    image: rabbitmq:4-management
    hostname: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: lab12sharedsecretcookie
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbit1_data:/var/lib/rabbitmq

  rabbit2:
    image: rabbitmq:4-management
    hostname: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: lab12sharedsecretcookie
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - rabbit2_data:/var/lib/rabbitmq

  rabbit3:
    image: rabbitmq:4-management
    hostname: rabbit3
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit3
      RABBITMQ_ERLANG_COOKIE: lab12sharedsecretcookie
    ports:
      - "5675:5672"
      - "15675:15672"
    volumes:
      - rabbit3_data:/var/lib/rabbitmq

volumes:
  rabbit1_data:
  rabbit2_data:
  rabbit3_data:
